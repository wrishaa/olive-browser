<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Olive · tab groups prototype</title>
<!-- the app's real tokens and sidebar rules; groups.css is the proposed addition -->
<link rel="stylesheet" href="../../src/ui/ui.css">
<link rel="stylesheet" href="groups.css">
</head>
<body>
  <div id="bg"></div>
  <div id="cards"></div>
  <div class="lights" id="lights"><i></i><i></i><i></i></div>

  <aside id="sidebar">
    <div class="topbar drag">
      <div class="traffic-space"></div>
      <div class="nav-buttons no-drag">
        <button class="icon" id="btn-sidebar" title="Toggle sidebar (⌘S)"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="icon" id="btn-back" title="Back (⌘[)"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon" id="btn-forward" title="Forward (⌘])" disabled><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon" id="btn-reload" title="Reload (⌘R)"><svg viewBox="0 0 16 16" class="i-reload"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>

    <div id="urlbar" class="no-drag" title="Open location (⌘L)">
      <button id="btn-site-settings" class="site-settings"><span class="lock"></span></button>
      <span class="host"></span>
      <div class="progress"></div>
    </div>

    <div id="tablist" class="no-drag">
      <div id="pinned" class="list" data-list="pinned"></div>
      <div class="divider" id="divider"><span class="line"></span><button id="btn-clear" title="Close all unpinned tabs">Clear</button></div>
      <button id="newtab" class="row newtab-row"><span class="plus">+</span><span class="title">New Tab</span></button>
      <div id="unpinned" class="list" data-list="unpinned"></div>
      <div class="list-spacer drag"></div>
    </div>

    <!-- agent section: groups opened by agents sit at the bottom of the sidebar, outside the
         scrolling tab list, so they stay in view however long the user's list gets -->
    <div class="divider agent-divider no-drag"><span class="line"></span></div>
    <div id="agent" class="list no-drag" data-list="agent"></div>

    <button id="btn-ublock" class="no-drag">uBO Lite · on</button>

    <div class="footer no-drag">
      <span id="profile-badge"></span>
      <button id="btn-ledger">Activity</button>
      <span class="spacer"></span>
      <button class="icon" id="btn-devtools"><svg viewBox="0 0 16 16"><path d="m5.5 4.5-3.5 3.5 3.5 3.5M10.5 4.5l3.5 3.5-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" id="btn-split"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="icon" id="btn-new"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </aside>

  <div id="drag-ghost" hidden></div>
  <script src="proto.js"></script>
</body>
</html>

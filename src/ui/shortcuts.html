<body><header><h1>Keyboard Shortcuts</h1><p>Click a shortcut, press keys, then save. ⌫ clears; Esc cancels.</p><p>Recent tabs: hold modifiers to walk, then release to switch.</p><button id="reset" aria-controls="reset-confirm" aria-expanded="false">reset all to defaults</button><section id="reset-confirm" hidden aria-labelledby="reset-title"><h2 id="reset-title">reset all keyboard shortcuts?</h2><p>this restores the defaults for this profile.</p><div class="panel-actions"><button id="reset-cancel">cancel</button><button id="reset-accept" class="primary">reset shortcuts</button></div></section><p id="status" role="status" aria-live="polite"></p></header><main id="commands"></main><script src="shortcuts.js"></script></body></html>

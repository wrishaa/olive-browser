<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Olive</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="bg"></div>
  <div id="cards"></div>
  <div id="empty" hidden>
    <div class="empty-inner">
      <div class="logo"></div>
      <div class="empty-title">Olive</div>
      <div class="empty-hint"><kbd>⌘</kbd><kbd>T</kbd> new tab &nbsp;·&nbsp; <kbd>⌃</kbd><kbd>⇧</kbd><kbd>=</kbd> split view &nbsp;·&nbsp; <kbd>⌘</kbd><kbd>S</kbd> sidebar</div>
    </div>
  </div>

  <aside id="sidebar">
    <div class="topbar drag">
      <div class="traffic-space"></div>
      <div class="nav-buttons no-drag">
        <button class="icon" id="btn-sidebar" title="Toggle sidebar (⌘S)"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="icon" id="btn-back" title="Back (⌘[)"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon" id="btn-forward" title="Forward (⌘])"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon" id="btn-reload" title="Reload (⌘R)"><svg viewBox="0 0 16 16" class="i-reload"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 16 16" class="i-stop"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
    </div>

    <div id="urlbar" class="no-drag" title="Open location (⌘L)">
      <span class="lock"></span>
      <span class="host"></span>
      <button class="icon small" id="btn-copy" title="Copy URL (⇧⌘C)"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 10.5V4a1.5 1.5 0 0 1 1.5-1.5H10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <div class="progress"></div>
    </div>

    <div id="tablist" class="no-drag">
      <div id="pinned" class="list" data-list="pinned"></div>
      <div class="divider" id="divider"><span class="line"></span><button id="btn-clear" title="Close all unpinned tabs">Clear</button></div>
      <button id="newtab" class="row newtab-row"><span class="plus">+</span><span class="title">New Tab</span></button>
      <div id="unpinned" class="list" data-list="unpinned"></div>
      <div class="list-spacer drag"></div>
    </div>

    <button id="btn-ublock" class="no-drag" title="uBO Lite basic network rules">uBO Lite</button>

    <div id="downloads" class="no-drag" hidden></div>

    <div class="footer no-drag">
      <span id="profile-badge"></span>
      <button id="agent-badge" title="Agent endpoints (click to copy)"></button>
      <span class="spacer"></span>
      <button class="icon" id="btn-devtools" title="Developer tools (⌥⌘I)"><svg viewBox="0 0 16 16"><path d="m5.5 4.5-3.5 3.5 3.5 3.5M10.5 4.5l3.5 3.5-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" id="btn-split" title="Split view with new tab (⌃⇧=)"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="icon" id="btn-new" title="New tab (⌘T)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div id="sidebar-resize" class="no-drag"></div>
  </aside>
  <div id="peek-zone"></div>

  <div id="findbar" hidden>
    <svg viewBox="0 0 16 16" class="find-icon"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="find-input" placeholder="Find in page" spellcheck="false">
    <span id="find-count"></span>
    <button class="icon" id="find-prev" title="Previous (⇧⌘G)"><svg viewBox="0 0 16 16"><path d="m4 10 4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon" id="find-next" title="Next (⌘G)"><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon" id="find-close" title="Close (esc)"><svg viewBox="0 0 16 16"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>

  <div id="palette-scrim" hidden>
    <div id="palette">
      <div class="palette-input-row">
        <span class="palette-mode" id="palette-mode"></span>
        <input id="palette-input" spellcheck="false" autocomplete="off" placeholder="Search or enter URL…">
      </div>
      <div id="palette-results"></div>
      <div class="palette-hints"><span><kbd>↵</kbd> open</span><span><kbd>⇧</kbd><kbd>↵</kbd> open in split</span><span><kbd>esc</kbd> close</span></div>
    </div>
  </div>

  <div id="drag-ghost" hidden></div>
  <div id="toast" hidden></div>
  <script src="ui.js"></script>
</body>
</html>
